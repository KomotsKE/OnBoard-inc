# Хуки запускаются локально перед коммитом и в CI (`pre-commit run --all-files`).
# Установка: make hooks
minimum_pre_commit_version: "3.5.0"
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$          # в markdown два пробела — перевод строки
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key

  # Conventional Commits: линтер сообщения коммита
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - --strict
          - feat
          - fix
          - docs
          - style
          - refactor
          - perf
          - test
          - build
          - ci
          - chore
          - revert

  # План работ — единственный источник правды о том, где мы находимся,
  # и новая сессия начинает с него. Рассогласование дороже, чем кажется.
  - repo: local
    hooks:
      - id: tasklist
        name: план работ согласован
        entry: python3 scripts/check-tasklist.py
        language: system
        files: ^docs/tasklist\.md$
        pass_filenames: false

      # Документ, советующий несуществующую команду, хуже отсутствующего.
      - id: docs-commands
        name: команды в документации существуют
        entry: python3 scripts/check-docs.py
        language: system
        files: ^(Makefile|CLAUDE\.md|README\.md|docs/.*\.md|[^/]+/README\.md)$
        pass_filenames: false

  # Python: линтер и форматтер бэкенда
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Версия совпадает с backend/pyproject.toml: иначе хук и `make lint`
    # расходятся в сортировке импортов и дают противоречивые сигналы.
    rev: v0.15.22
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

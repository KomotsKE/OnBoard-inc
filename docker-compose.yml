# Локальный стек OnBoard. Разворачивание на сервере — после приёмки MVP (§15 docs/vision.md).
# Сервисы api и panel добавляются в задачах T0.3 и T0.6, migrate — в T0.4:
# контейнер без кода падал бы в рестарт-луп.

name: onboard

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # C.UTF-8 — детерминированная сортировка, не зависящая от локали хоста.
      # Списки в панели сортируются по created_at, поэтому порядок букв не важен,
      # а воспроизводимость важна.
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  migrate:
    # Одноразовый сервис: применяет миграции и завершается. api ждёт его
    # успешного кода возврата, иначе стартовал бы на несуществующей схеме.
    build: ./backend
    env_file: .env
    environment:
      ONBOARD_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    build: ./backend
    env_file: .env
    environment:
      # Внутри compose хост базы — имя сервиса, а не localhost из .env.
      ONBOARD_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Код смонтирован: правка видна после перезапуска контейнера, пересборка
      # нужна только при изменении зависимостей.
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  panel:
    build: ./panel
    environment:
      # Прокси vite ходит к API по имени сервиса внутри сети compose.
      VITE_API_TARGET: http://api:8000
    ports:
      - "${PANEL_PORT:-5173}:5173"
    volumes:
      # Код смонтирован для горячей перезагрузки; node_modules остаются
      # внутри контейнера, иначе хостовые модули перетрут собранные под alpine.
      - ./panel:/app
      - panel_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  testsite:
    # Непривилегированный образ: слушает 8080 и работает не от root.
    image: nginxinc/nginx-unprivileged:1.27-alpine
    ports:
      - "${TESTSITE_PORT:-8080}:8080"
    volumes:
      - ./testsite:/usr/share/nginx/html:ro
    healthcheck:
      # Именно 127.0.0.1, а не localhost: внутри контейнера localhost разрешается
      # в ::1, а nginx слушает только IPv4 — проверка падала бы на здоровом сервисе.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  panel_node_modules:

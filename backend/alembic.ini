# Миграции запускаются отдельным процессом, поэтому Alembic синхронный —
# async здесь ничего не даёт и только усложнил бы env.py (ADR-0010).
[alembic]
script_location = alembic
prepend_sys_path = .
# Строка подключения берётся из настроек приложения в env.py, а не отсюда:
# один источник правды и никаких секретов в репозитории.
sqlalchemy.url =
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

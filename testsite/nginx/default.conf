# Раздача стенда и файлов виджета с заголовками кэша из ADR-0009:
# loader.js живёт пять минут, чтобы исправления доезжали до клиентов;
# ядро и редактор — с хэшем в имени и вечным кэшем.
#
# Файлы виджета лежат в отдельном корне, а не внутри каталога стенда:
# вложить одно монтирование в другое, смонтированное только для чтения,
# Docker не позволяет.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location = /widget/loader.js {
        alias /usr/share/widget/loader.js;
        add_header Cache-Control "max-age=300" always;
    }

    # Префикс /widget/ объявлен без ^~, чтобы это правило проверялось раньше
    # и хэшированные файлы получали вечный кэш.
    location ~ ^/widget/(?<asset>(?:core|editor)\.[a-f0-9]+\.js)$ {
        alias /usr/share/widget/$asset;
        add_header Cache-Control "max-age=31536000, immutable" always;
    }

    location /widget/ {
        alias /usr/share/widget/;
    }

    # Стенд — SPA: прямой заход на /dashboard должен отдать index.html,
    # иначе проверка навигации без перезагрузки (T2.7) невозможна.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
